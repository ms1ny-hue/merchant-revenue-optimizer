[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm run build"

[dev]
  command = "python3 -m http.server 8765"
  port = 8888
  targetPort = 8765

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# Long-cache static image assets (OG card, fixture). Improves Lighthouse
# "Uses efficient cache policy" without holding back HTML updates.
[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fixtures/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# Long-cache the generated Tailwind + Chart.js bundles. File names are
# content-less so when they change we rely on the HTML revalidating to
# pick up new <script>/<link> references; if we ever introduce hashed
# filenames, bump this to immutable without must-revalidate.
[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, must-revalidate"
